[package]
name = "expansion-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "expansion_bench"
path = "main.rs"

[[bin]]
name = "checkpoint_work"
path = "checkpoint_work.rs"

[[bin]]
name = "tail_bench"
path = "tail_bench.rs"

[[bin]]
name = "terminal_bench"
path = "terminal_bench.rs"

[[bin]]
name = "overall_bench"
path = "overall_bench.rs"
required-features = ["cuda"]

[features]
cuda = ["cv/cuda"]

[dependencies]
cv = { package = "collatz-verify", path = "../..", default-features = false }
rayon = "1.11"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
