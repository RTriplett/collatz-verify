[package]
name = "expansion-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "expansion_bench"
path = "main.rs"

[dependencies]
cv = { package = "collatz-verify", path = "../..", default-features = false }
rayon = "1.11"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
