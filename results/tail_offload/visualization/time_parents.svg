   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 550.0296)">Same 484 accepted roots from 512 K38 draws; sampled N72 work on RTX 4090 + Ryzen 7700X.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 565.3296)">Means of 2 continuous repetitions. Whiskers show observed min–max, not confidence intervals.</text>
