   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 586.4048)">Other CPU work includes expansion, dispatch, bookkeeping, fallback and worker overhead. One-time setup is excluded.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 600.0048)">GPU stream timers overlap and do not separate screening from tail stepping; no exclusive GPU-time split is inferred.</text>
