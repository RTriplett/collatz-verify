  <g id="text_33">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536879" x="70.56" y="520.128" transform="rotate(-0 70.56 520.128)">CPU and GPU work overlap. CPU core-seconds are not added to elapsed seconds.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 550.0296)">Same 484 accepted roots from 512 K38 draws; sampled N72 work on RTX 4090 + Ryzen 7700X.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 565.3296)">Means of 2 continuous repetitions. Whiskers show observed min–max, not confidence intervals.</text>
  </g>
  <g id="text_35">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 586.4048)">Other CPU work includes expansion, dispatch, bookkeeping, fallback and worker overhead. One-time setup is excluded.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #536879" transform="translate(60.48 600.0048)">GPU stream timers overlap and do not separate screening from tail stepping; no exclusive GPU-time split is inferred.</text>
  </g>
