[package]
name = "walkback-reuse-probes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cv = { package = "collatz-verify", path = "../..", default-features = false }
rayon = "1.11"
serde_json = "1.0"

[[bin]]
name = "checkpoint_cost"
path = "checkpoint_cost.rs"

[[bin]]
name = "target_savings"
path = "target_savings.rs"

[[bin]]
name = "tree_savings"
path = "tree_savings.rs"

[[bin]]
name = "cache_demo"
path = "cache_demo.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
