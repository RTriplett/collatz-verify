[package]
name = "collatz-verify"
version = "0.1.0"
edition = "2021"
description = "Clean reference implementation of LSB-tree Collatz verification (Angeltveit 2026) with path-merge improvements, exact workload counting, and a measured cost model."
build = "build.rs"

[lib]
name = "cv"
path = "src/lib.rs"

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["cuda"]
# Compile cuda/kernel.cu with nvcc and enable `--gpu` (CPU-only: --no-default-features).
cuda = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 3
